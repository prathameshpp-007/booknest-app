name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${SHORT_SHA}"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: docker build -t "${{ steps.meta.outputs.image }}" .

      - name: Push image
        run: docker push "${{ steps.meta.outputs.image }}"

  update-gitops:
    name: Update GitOps repository
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: prathameshpp-007/booknest-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: booknest-gitops

      - name: Update image tag and push
        working-directory: booknest-gitops
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          sed -i -E "s#^([[:space:]]*image:).*#\1 ${IMAGE}#" k8s/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "Image already up to date; nothing to commit."
          else
            git commit -m "ci: update image to ${TAG}"
            git push
          fi
