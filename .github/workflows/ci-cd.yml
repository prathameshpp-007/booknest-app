name: BookNest CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'k8s/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/prathameshpp-007/booknest-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/prathameshpp-007/booknest-app:${{ github.sha }}
            ghcr.io/prathameshpp-007/booknest-app:latest

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: prathameshpp-007/booknest-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops

      - name: Update Kubernetes image
        env:
          TAG: ${{ github.sha }}
        run: |
          sed -i "s|image: .*|image: ${IMAGE_NAME}:${TAG}|" gitops/k8s/deployment.yaml

          cd gitops

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "chore: update BookNest image to ${TAG}"
            git push origin main
          fi