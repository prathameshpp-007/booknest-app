apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: booknest
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/prathameshpp-007/booknest-gitops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: booknest
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
